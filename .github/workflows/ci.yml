# CI — main 에 올라가거나 PR 이 열릴 때마다 자동으로 코드를 검사한다.
# 하나라도 실패하면 GitHub 에 ❌ 로 표시된다.
# 검사 항목의 근거: CLAUDE.md 「코드 규칙」

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    name: 모바일 앱 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: Node.js 준비 (.nvmrc 버전 사용)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 코드 검사
        run: npm run lint

      - name: 서식 검사
        run: npm run format:check
